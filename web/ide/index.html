<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forge IDE</title>
  <link rel="stylesheet" href="vault-ide.css">
</head>
<body>
  <header id="top">
    <span class="brand">VAULT IDE</span>
    <span id="project">Connecting…</span>
    <span id="file">No file open</span>
    <button id="save" type="button">Save</button>
    <span id="state">Starting…</span>
  </header>
  <main id="workbench">
    <aside id="explorer">
      <div class="rail-title">PROJECT FILES</div>
      <input id="filter" placeholder="Filter files…" autocomplete="off">
      <div id="files"></div>
    </aside>
    <section id="editor"></section>
  </main>
  <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="vault-ide.js"></script>
</body>
</html>
